_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "One flight request, the company's real travel handbook: book it, refuse it, or hold it for sign-off"
summary: "An agent handles one traveller's flight request under Standex International's TVL 1-1 Travel Policies and Guidelines (February 2018), read verbatim. It reads the trip record, searches a simulated flight world (real airports and airlines, synthetic schedules and fares) and submits a decision with the offer, cabin, reason, approver and handbook section. A deterministic verifier rebuilds the offers and the handbook's answer itself and checks every field. Twenty-four cases cover cabin limits measured per segment on both sides of each boundary, an approval line on the ticket price to the cent, an airline choice tied with the lowest fare, connections against nonstops, companions and personal trips, and the handbook's own unclear words."
highlights:
  - "The verbatim handbook: no paraphrase, no rules restated in the task"
  - "Exact boundaries: 180 against 179 and 600 against 599 scheduled minutes, a $7,500.00 ticket, a $1 airline difference"
  - "Unclear clauses become holds for approval, each once, with clear twins on both sides"
  - "Fully offline: a hash-seeded flight world with unguessable offer ids"
steps:
  - "Name a case, for example alder-quince, with the traveller's request"
  - "The agent reads the trip record and searches flights on the trip's route and date"
  - "It submits BOOK, REFUSE or FLAG_FOR_APPROVAL with the offer, cabin, reason, approver and section"
  - "The verifier recomputes the handbook's answer and checks every field"
